<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PIM Каталог{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    .product-thumb { width: 60px; height: 60px; object-fit: contain; background: #f8f9fa; }
    .filter-sidebar { min-width: 260px; }
    .stat-card { border-left: 4px solid; }
    .stat-good { border-color: #198754; }
    .stat-warn { border-color: #ffc107; }
    .stat-bad { border-color: #dc3545; }
    .stat-info { border-color: #0d6efd; }
    .badge-quality { font-size: 0.7rem; }
    .table td, .table th { vertical-align: middle; white-space: nowrap; }
    .table td.wrap { white-space: normal; max-width: 300px; }
    .category-tree .list-group-item { padding: 0.4rem 0.8rem; }
    .active-filter { background-color: #e7f1ff; border-radius: 4px; padding: 2px 4px; }
    a { text-decoration: none; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'catalog:dashboard' %}">
        <i class="bi bi-grid-3x3-gap"></i> PIM Каталог
      </a>
      <div class="navbar-nav ms-3">
        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"
           href="{% url 'catalog:dashboard' %}">Категории</a>
        <a class="nav-link {% if request.resolver_match.url_name == 'product_list_all' %}active{% endif %}"
           href="{% url 'catalog:product_list_all' %}">Все товары</a>
        <a class="nav-link" href="/admin/">Админка</a>
      </div>
    </div>
  </nav>

  <div class="container-fluid mt-3 mb-5">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
