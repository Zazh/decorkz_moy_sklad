{% extends "base.html" %}

{% block title %}Выход — Decorkz.kz{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-sm space-y-8 text-center">
        <h1 class="text-2xl font-light tracking-wide">Выход</h1>
        <p class="text-sm text-gray-500">Вы уверены, что хотите выйти?</p>
        <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}
            <button type="submit"
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">
                Выйти
            </button>
        </form>
    </div>
</div>
{% endblock %}
