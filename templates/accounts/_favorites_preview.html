{% load catalog_tags %}

{% if products %}
<div class="grid grid-cols-2 gap-3 px-4">
    {% for p in products %}
    <article>
        <div class="relative">
            {% include "components/favorite_btn.html" with product_id=p.pk %}
            <a href="{{ p.get_absolute_url }}" class="block">
                <figure>
                    {% with images=p.card.images.all %}
                    {% if images %}
                    <div class="aspect-square overflow-hidden">
                        <img src="{{ images.0.image.url }}" class="w-full h-full object-cover" loading="lazy" alt="{{ p.title }}">
                    </div>
                    {% else %}
                    <div class="flex items-center justify-center bg-gray-100 text-gray-400 aspect-square w-full">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="#000000" width="40px" height="40px" viewBox="0 0 32 32"><path d="M30,3.4141,28.5859,2,2,28.5859,3.4141,30l2-2H26a2.0027,2.0027,0,0,0,2-2V5.4141ZM26,26H7.4141l7.7929-7.793,2.3788,2.3787a2,2,0,0,0,2.8284,0L22,19l4,3.9973Zm0-5.8318-2.5858-2.5859a2,2,0,0,0-2.8284,0L19,19.1682l-2.377-2.3771L26,7.4141Z"/><path d="M6,22V19l5-4.9966,1.3733,1.3733,1.4159-1.416-1.375-1.375a2,2,0,0,0-2.8284,0L6,16.1716V6H22V4H6A2.002,2.002,0,0,0,4,6V22Z"/></svg>
                    </div>
                    {% endif %}
                    {% endwith %}
                    <figcaption class="py-2 flex gap-1 flex-col">
                        <div class="flex gap-3 items-end">
                            {% if p.rrp_price %}
                            <span class="text-base leading-none font-bold text-red-500">
                                {{ p.rrp_price|format_price }} &#8376;
                            </span>
                            {% endif %}
                        </div>
                        <div class="h-10 overflow-hidden">
                            <span class="font-medium text-gray-700 text-xs line-clamp-2">{{ p.title }}</span>
                        </div>
                    </figcaption>
                </figure>
            </a>
        </div>
    </article>
    {% endfor %}
</div>

{% if total > 10 %}
<div class="px-4 pt-4 pb-2">
    <a href="{% url 'favorites' %}" class="block w-full text-center border border-gray-300 rounded-lg py-3 text-sm font-medium text-gray-700 active:bg-gray-50">
        Смотреть все ({{ total }})
    </a>
</div>
{% endif %}

{% else %}
<div class="flex flex-col items-center justify-center text-center gap-3 py-12">
    <svg class="w-16 h-16 text-gray-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"/>
    </svg>
    <p class="text-gray-500 text-sm">Здесь будут ваши избранные товары</p>
</div>
{% endif %}
